<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Glow Beauty | My Cart</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#fff8fb;
        }

        header{
            background:#d63384;
            color:white;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px 50px;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-weight:bold;
        }

        nav a:hover{
            text-decoration:underline;
        }

        h1{
            text-align:center;
            color:#d63384;
            margin:30px 0;
        }

        table{
            width:90%;
            margin:auto;
            border-collapse:collapse;
            background:white;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
            border-radius:10px;
            overflow:hidden;
        }

        th{
            background:#d63384;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#ffeef5;
        }

        .remove-btn{
            background:red;
            color:white;
            padding:8px 15px;
            text-decoration:none;
            border-radius:5px;
        }

        .remove-btn:hover{
            background:darkred;
        }

        .total{
            width:90%;
            margin:25px auto;
            text-align:right;
            color:#d63384;
            font-size:28px;
            font-weight:bold;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:20px;
            margin:30px;
        }

        .btn{
            background:#d63384;
            color:white;
            text-decoration:none;
            padding:12px 25px;
            border-radius:8px;
            font-weight:bold;
        }

        .btn:hover{
            background:#b0266d;
        }

        footer{
            margin-top:50px;
            background:#d63384;
            color:white;
            text-align:center;
            padding:20px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">Glow Beauty</div>

    <nav>
        <a href="/">Home</a>
        <a href="/products">Products</a>
        <a href="/cart">Cart</a>
        <a href="/orders">Orders</a>
    </nav>

</header>

<h1>🛒 My Shopping Cart</h1>

<table>

    <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Subtotal</th>
        <th>Action</th>
    </tr>

    <tr th:each="item : ${cartItems}">

        <td th:text="${item.productName}"></td>

        <td>₹ <span th:text="${item.price}"></span></td>

        <td th:text="${item.quantity}"></td>

        <td>₹ <span th:text="${item.price * item.quantity}"></span></td>

        <td>
            <a th:href="@{/cart/delete/{id}(id=${item.id})}" class="remove-btn">
                Remove
            </a>
        </td>

    </tr>

</table>

<div class="total">
    Grand Total : ₹ <span th:text="${totalPrice}"></span>
</div>

<div class="buttons">
    <a href="/products" class="btn">Continue Shopping</a>
    <a href="/checkout" class="btn">Proceed to Checkout</a>
</div>

<footer>
    <p>&copy; 2026 Glow Beauty | All Rights Reserved</p>
</footer>

</body>
</html>
