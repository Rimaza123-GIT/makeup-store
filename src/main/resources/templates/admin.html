<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | Glow Beauty</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#fff8fb;
        }

        header{
            background:#d63384;
            color:white;
            padding:18px 40px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-weight:bold;
        }

        .container{
            width:90%;
            margin:40px auto;
        }

        h2{
            text-align:center;
            color:#d63384;
            margin-bottom:30px;
        }

        .btn{
            background:#d63384;
            color:white;
            padding:10px 18px;
            text-decoration:none;
            border-radius:8px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        th{
            background:#d63384;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        .edit{
            background:#28a745;
            padding:8px 14px;
            color:white;
            text-decoration:none;
            border-radius:6px;
        }

        .delete{
            background:red;
            padding:8px 14px;
            color:white;
            text-decoration:none;
            border-radius:6px;
        }

        footer{
            margin-top:40px;
            background:#d63384;
            color:white;
            text-align:center;
            padding:20px;
        }

    </style>

</head>

<body>

<header>

    <h2>Glow Beauty Admin</h2>

    <nav>
        <a href="/">Home</a>
        <a href="/products">Products</a>
        <a href="/orders">Orders</a>
    </nav>

</header>

<div class="container">

    <h2>Manage Products</h2>

    <div style="margin-bottom:20px;">
        <a href="/addProduct" class="btn">+ Add Product</a>
    </div>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Brand</th>
            <th>Price</th>
            <th>Action</th>
        </tr>

        <tr th:each="product : ${products}">

            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.brand}"></td>
            <td>₹ <span th:text="${product.price}"></span></td>

            <td>
                <a th:href="@{/edit/{id}(id=${product.id})}" class="edit">Edit</a>

                <a th:href="@{/delete/{id}(id=${product.id})}" class="delete">Delete</a>
            </td>

        </tr>

    </table>

</div>

<footer>
    © 2026 Glow Beauty | Admin Panel
</footer>

</body>
</html>
