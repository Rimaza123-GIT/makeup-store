<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Orders | Glow Beauty</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#fff8fb;
        }

        header{
            background:#d63384;
            color:white;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header h2{
            margin-left:20px;
        }

        nav{
            margin-right:20px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            font-weight:bold;
        }

        h1{
            text-align:center;
            color:#d63384;
            margin:30px;
        }

        table{
            width:90%;
            margin:auto;
            border-collapse:collapse;
            background:white;
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        th{
            background:#d63384;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#ffeef5;
        }

        footer{
            background:#d63384;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:40px;
        }

    </style>

</head>

<body>

<header>

    <h2>Glow Beauty</h2>

    <nav>
        <a href="/">Home</a>
        <a href="/products">Products</a>
        <a href="/cart">Cart</a>
        <a href="/orders">Orders</a>
    </nav>

</header>

<h1>My Orders</h1>

<table>

    <tr>
        <th>Customer</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Payment</th>
        <th>Total</th>
    </tr>

    <tr th:each="order : ${orders}">

        <td th:text="${order.customerName}"></td>

        <td th:text="${order.phone}"></td>

        <td th:text="${order.address}"></td>

        <td th:text="${order.paymentMethod}"></td>

        <td>₹ <span th:text="${order.total}"></span></td>

    </tr>

</table>

<footer>

    © 2026 Glow Beauty | All Rights Reserved

</footer>

</body>
</html>
