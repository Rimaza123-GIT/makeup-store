<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success | Glow Beauty</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#fff8fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            width:500px;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 5px 20px rgba(0,0,0,.2);
        }

        .icon{
            font-size:70px;
        }

        h1{
            color:#d63384;
            margin:20px 0;
        }

        p{
            font-size:18px;
            color:#555;
            margin-bottom:30px;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:20px;
        }

        .btn{
            background:#d63384;
            color:white;
            text-decoration:none;
            padding:12px 25px;
            border-radius:8px;
            font-weight:bold;
        }

        .btn:hover{
            background:#b0266d;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="icon">✅</div>

    <h1>Order Placed Successfully!</h1>

    <p>
        Thank you for shopping with <b>Glow Beauty</b>.<br>
        Your order has been placed successfully.
    </p>

    <div class="buttons">

        <a href="/" class="btn">
            Continue Shopping
        </a>

        <a href="/orders" class="btn">
            View Orders
        </a>

    </div>

</div>

</body>
</html>
